# 云枢智学 · Nginx 反向代理（公网演示加固版）
#
# 相比内网版本多了四道防护，都是为"内网穿透"准备的：
#   1. server_tokens off        —— 不暴露 nginx 版本，减少指纹
#   2. 接口限流                 —— 防扫描器刷接口，把 TTS/ASR/LLM 额度烧光
#   3. 管理端 Basic Auth        —— 就算猜到 /admin 也要再过一道密码
#   4. 屏蔽 /api/docs           —— 不把接口地图送给扫站的人
#
# 关键前提：穿透只映射 80 端口，MySQL/Redis/MinIO/Milvus 的宿主机端口不经过隧道，
# 公网访问不到（隧道只转发你指定的端口）。

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 12m;
    client_body_timeout 60s;

    # ---------- 公网期间关闭接口文档 ----------
    location = /api/docs { return 404; }
    location = /api/redoc { return 404; }
    location = /api/openapi.json { return 404; }

    # ---------- 登录/注册：限流更严（每 IP 每分钟 10 次）----------
    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # ---------- 接口 ----------
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 简答判分为请求内等待，最长 30 秒，超时留足余量
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # ---------- 面试语音 WebSocket（票据走子协议头，不放在 URL 上）----------
    location /api/v1/ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ---------- 管理端（独立工程，base 为 /admin/）----------
    location /admin/ {
        # 第二道门：Basic Auth，账号密码见 deploy/.htpasswd
        auth_basic "Yunshu Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;

        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 兼容 /admin 不带斜杠
    location = /admin {
        return 301 /admin/;
    }

    # ---------- 学员端（独立工程，base 为 /）----------
    location / {
        root /usr/share/nginx/html/student;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
