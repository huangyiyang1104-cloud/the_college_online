# 云枢智学 · 一键部署编排
#
# 用法：
#   1) 准备环境变量：cp .env.example .env  （Windows: copy .env.example .env）
#      并在 backend/.env 填好应用配置（数据库密码、模型 key 等）
#   2) 只起基础设施（MySQL / Redis / MinIO / etcd / Milvus）：
#        docker compose up -d
#   3) 连应用一起起（推荐用一键盘脚本，内含构建镜像）：
#        Windows:      powershell -ExecutionPolicy Bypass -File .\up.ps1
#        Linux/macOS:  ./up.sh
#      脚本内部是 docker build + docker compose --profile app up -d --no-build，
#      用于绕开部分环境（compose v5 + buildx）下 docker compose build 的 bake 报错。
#   4) 额外工具（Milvus 可视化 Attu）：
#        docker compose --profile tools up -d
#
# 说明：
#   - 默认 profile 只含基础设施，后端未写完也能一键拉起依赖。
#   - 数据库表结构由 scripts/sql/schema.sql 在 MySQL 首次初始化时自动执行；
#     之后改表请用 Alembic 迁移，不要在容器里手工改。

name: yunshu

networks:
  yunshu-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:
  etcd-data:
  milvus-data:

services:
  # ============ 关系数据库 ============
  mysql:
    image: mysql:8.0
    container_name: yunshu-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --max_connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yunshu}
      MYSQL_USER: ${MYSQL_USER:-yunshu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../scripts/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - yunshu-net

  # ============ 缓存 / 限流 / 队列 ============
  redis:
    image: redis:7-alpine
    container_name: yunshu-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    environment:
      # 仅供健康检查使用，不参与启动命令
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - yunshu-net

  # ============ 对象存储（Milvus 依赖 + 本地替代 OSS）============
  # 说明：官方 minio/minio 镜像已改为需要鉴权（pull 直接 401/403），
  #      这里用 Bitnami 遗留仓库里的同一份 MinIO 二进制，环境变量与 API 完全一致。
  #      MINIO_DEFAULT_BUCKETS 会在首次启动时自动建桶，因此不需要 mc 初始化容器。
  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:latest}
    container_name: yunshu-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-yunshu},milvus
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - yunshu-net

  # ============ Milvus 元数据存储 ============
  etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.16}
    container_name: yunshu-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - yunshu-net

  # ============ 向量库 ============
  milvus:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.5.4}
    container_name: yunshu-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: milvus
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - yunshu-net

  # ============ 应用：API ============
  api:
    profiles: ["app"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: yunshu-api:local
    container_name: yunshu-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    env_file:
      # 应用配置只有一份，放在 backend/.env，避免与 deploy/.env 漂移
      - ../backend/.env
    # RVC 跑在宿主机（需要 GPU，不进容器）；容器内 127.0.0.1 指容器自己，必须用这个别名
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RVC_SERVICE_URL: http://host.docker.internal:8010
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      # MinIO SDK 只接受 host:port，不要带 http://
      MINIO_ENDPOINT: minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - yunshu-net

  # ============ 应用：异步任务 ============
  # 说明：后台任务（音频生成、简历解析）当前走 FastAPI BackgroundTasks（进程内），
  # 项目里没有 app/tasks/celery_app，起 worker 只会反复崩溃重启。
  # 将来真要用 Celery，先补 tasks 模块再打开下面这段。
  #
  # worker:
  #   profiles: ["app"]
  #   image: yunshu-api:local
  #   container_name: yunshu-worker
  #   restart: unless-stopped
  #   command: ["celery", "-A", "app.tasks.celery_app", "worker", "-l", "info", "-c", "2"]
  #   env_file:
  #     - ../backend/.env
  #   depends_on:
  #     api:
  #       condition: service_started
  #   networks:
  #     - yunshu-net

  # ============ 应用：反向代理 ============
  nginx:
    profiles: ["app"]
    image: nginx:1.27-alpine
    container_name: yunshu-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 管理端 Basic Auth 凭据（穿透公网时多一道门，内网演示可删）
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      # 两个独立前端工程的构建产物：学员端 → /，管理端 → /admin
      - ../frontend-student/dist:/usr/share/nginx/html/student:ro
      - ../frontend-admin/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - yunshu-net

  # ============ 工具：Milvus 可视化 ============
  attu:
    profiles: ["tools"]
    image: ${ATTU_IMAGE:-zilliz/attu:v2.5}
    container_name: yunshu-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${ATTU_PORT:-3000}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - yunshu-net
